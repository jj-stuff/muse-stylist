<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"><meta name="description" content="Muse, a personal stylist you can text. Two outfits for your day from the clothes you own."><title>Muse</title><link rel="stylesheet" href="style.css"></head><body>
<header class="bar"><span></span><h1>Muse</h1><button class="link" id="open-closet">Closet<span id="closet-count"></span></button></header>
<main id="thread" aria-live="polite" aria-label="Conversation with Muse"></main>
<div class="dock">
 <div class="chips" id="chips" aria-label="Quick replies"></div>
 <form class="composer" id="composer">
  <label class="attach" for="upload" aria-label="Add clothing photos"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></label>
  <input type="file" id="upload" accept="image/jpeg,image/png,image/webp" multiple hidden>
  <label class="sr-only" for="text">Message</label>
  <input id="text" autocomplete="off" maxlength="1500" placeholder="Message">
  <button class="send" type="submit" aria-label="Send" disabled><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
 </form>
</div>
<dialog id="closet" aria-labelledby="closet-title">
 <header class="bar"><span></span><h2 id="closet-title">Closet</h2><button class="link strong" id="close-closet">Done</button></header>
 <div class="sheet" tabindex="-1" autofocus>
  <h3>Your pieces</h3>
  <ul class="group" id="pieces"></ul>
  <label class="button" for="closet-upload">Add photos</label>
  <input type="file" id="closet-upload" accept="image/jpeg,image/png,image/webp" multiple hidden>
  <h3>Brands I know</h3>
  <ul class="group" id="samples"></ul>
 </div>
</dialog>
<script type="module" src="app.js"></script></body></html>
